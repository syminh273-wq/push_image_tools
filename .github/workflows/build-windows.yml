name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build:desktop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --distpath dist --workpath build packaging/gemini_video_tool.spec

      - name: Smoke test (start the exe and load the UI)
        env:
          NO_BROWSER: "1"
          PORT: "5050"
        run: |
          $p = Start-Process -FilePath dist/GeminiVideoTool/GeminiVideoTool.exe -PassThru `
                 -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:5050/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content out.log, err.log -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            $tail = (Get-Content err.log -Tail 15 -ErrorAction SilentlyContinue) -join '%0A'
            Write-Output "::error title=exe did not start::$tail"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiVideoTool-windows
          path: dist/GeminiVideoTool

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/GeminiVideoTool -DestinationPath GeminiVideoTool-windows.zip
          gh release create "${{ github.ref_name }}" GeminiVideoTool-windows.zip --title "${{ github.ref_name }}" --notes "Windows build. Unzip, then run GeminiVideoTool.exe (needs Google Chrome)."
