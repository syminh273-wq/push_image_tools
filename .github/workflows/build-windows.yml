name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build:desktop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --distpath dist --workpath build packaging/gemini_video_tool.spec

      - name: Smoke test (open the app window and load the UI)
        run: |
          $dir = "dist/GeminiVideoTool"
          $log = "$dir/GeminiVideoTool.log"; $errlog = "$dir/GeminiVideoTool-error.log"
          $p = Start-Process -FilePath "$dir/GeminiVideoTool.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            $ok = (Test-Path $log) -and (Select-String -Path $log -Pattern "window shown" -Quiet)
            if ((Test-Path $errlog) -or $p.HasExited) { break }
          }
          $tail = ((Get-Content $errlog, $log -ErrorAction SilentlyContinue) | Select-Object -Last 25) -join '%0A'
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-Item $log, $errlog -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Output "::error title=app window did not open::$tail"
            exit 1
          }
          Write-Output "::notice title=app log::$tail"

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiVideoTool-windows
          path: dist/GeminiVideoTool

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/GeminiVideoTool -DestinationPath GeminiVideoTool-windows.zip
          gh release create "${{ github.ref_name }}" GeminiVideoTool-windows.zip --title "${{ github.ref_name }}" --notes "Windows build. Unzip, then run GeminiVideoTool.exe (needs Google Chrome)."
