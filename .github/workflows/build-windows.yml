name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build:desktop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --distpath dist --workpath build packaging/gemini_video_tool.spec

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiVideoTool-windows
          path: dist/GeminiVideoTool

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/GeminiVideoTool -DestinationPath GeminiVideoTool-windows.zip
          gh release create "${{ github.ref_name }}" GeminiVideoTool-windows.zip --title "${{ github.ref_name }}" --notes "Windows build. Unzip, then run GeminiVideoTool.exe (needs Google Chrome)."
